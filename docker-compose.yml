version: "3.8"
services:
  postgres:
    image: postgres:15
    container_name: iamplus-postgres
    environment:
      POSTGRES_USER: iamuser
      POSTGRES_PASSWORD: iampass
      POSTGRES_DB: iamdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
